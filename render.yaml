# One-click deploy of the WebSocket build (Render keeps a single long-lived Node
# process, which is what real WebSockets need). See docs/development-planning.md
# for why Vercel runs the SSE transport instead.
services:
  - type: web
    name: agnos-realtime-patient-form
    runtime: node
    plan: free
    region: singapore
    # NODE_ENV=production below makes npm skip devDependencies, and the build
    # genuinely needs them (Tailwind, TypeScript), so ask for them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_REALTIME_TRANSPORT
        value: websocket
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
